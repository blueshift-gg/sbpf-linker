name: Nightly compatibility

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: nightly-compatibility
  cancel-in-progress: false

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  timing:
    name: Resolve update cadence
    runs-on: ubuntu-latest
    outputs:
      propose: ${{ steps.clock.outputs.propose }}
    steps:
      - name: Check update cadence
        id: clock
        env:
          TZ: America/New_York
        shell: bash
        run: |
          propose=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            propose=true
          elif [[ "$(date +%u)" == "6" ]]; then
            propose=true
          fi

          echo "propose=$propose" >> "$GITHUB_OUTPUT"

  update:
    name: Test and propose latest nightly
    needs: timing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Resolve latest nightly
        id: nightly
        shell: bash
        run: |
          set -euo pipefail

          commit_date=$(rustc --version --verbose | sed -n 's/^commit-date: //p')
          test -n "$commit_date"

          echo "toolchain=nightly-${commit_date}" >> "$GITHUB_OUTPUT"
          rustc --version --verbose

      - name: Install from source
        run: >-
          cargo install --path . --locked
          --root target/latest-nightly-install

      - name: Load nightly LLVM through the proxy
        run: >-
          rustup run nightly
          target/latest-nightly-install/bin/sbpf-linker --version

      - name: Update pinned nightly
        if: needs.timing.outputs.propose == 'true'
        env:
          CANDIDATE: ${{ steps.nightly.outputs.toolchain }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(cat nightly-version.txt)
          test -n "$current"

          if [[ "$CANDIDATE" > "$current" ]]; then
            echo "$CANDIDATE" > nightly-version.txt
          else
            echo "Pinned nightly ${current} is already current."
          fi

      - name: Create nightly update pull request
        if: needs.timing.outputs.propose == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: nightly-version.txt
          branch: automation/update-rust-nightly
          delete-branch: true
          commit-message: >-
            ci: update pinned nightly to ${{ steps.nightly.outputs.toolchain }}
          title: >-
            ci: update pinned nightly to ${{ steps.nightly.outputs.toolchain }}
          body: |
            The daily compatibility check passed with `${{ steps.nightly.outputs.toolchain }}`.

            This updates the reproducible CI baseline to that nightly.

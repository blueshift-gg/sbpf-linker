name: Nightly compatibility

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: nightly-compatibility
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPDATE_BRANCH: automation/update-rust-nightly

jobs:
  update:
    name: Test and propose latest nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Create the app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ steps.app_token.outputs.token }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Resolve latest nightly
        id: nightly
        shell: bash
        run: |
          set -euo pipefail

          candidate=nightly-$(rustc --version --verbose | sed -n 's/^commit-date: //p')
          [[ "$candidate" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error::could not resolve a commit-date from rustc"
            exit 1
          }
          echo "toolchain=$candidate" >> "$GITHUB_OUTPUT"

          pinned=$(yq -e '.toolchain.channel' rust-toolchain.toml)

          if [[ ! "$candidate" > "$pinned" ]]; then
            echo "::notice::the pinned nightly ${pinned} is already current."
            echo "propose=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          yq -i ".toolchain.channel = \"$candidate\"" rust-toolchain.toml
          test "$(yq -e '.toolchain.channel' rust-toolchain.toml)" = "$candidate"
          git add rust-toolchain.toml
          echo "propose=true" >> "$GITHUB_OUTPUT"

          rustc --version --verbose

      - name: Install from source
        run: >-
          cargo install --path . --locked
          --root target/latest-nightly-install

      - name: Load nightly LLVM through the proxy
        run: >-
          rustup run nightly
          target/latest-nightly-install/bin/sbpf-linker --version

      - name: Test compiler-builtins dependency discovery
        env:
          SBPF_LINKER: ${{ github.workspace }}/target/latest-nightly-install/bin/sbpf-linker
          CARGO_TARGET_DIR: ${{ runner.temp }}/compiler-builtins-target
        run: .github/workflows/compiler-builtins/test.sh

      - name: Propose the update
        id: publish
        if: steps.nightly.outputs.propose == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          CANDIDATE: ${{ steps.nightly.outputs.toolchain }}
        shell: bash
        run: |
          set -euo pipefail

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "ci: update pinned nightly to $CANDIDATE"
          prev=$(git ls-remote origin "refs/heads/$UPDATE_BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$UPDATE_BRANCH:$prev" origin "HEAD:refs/heads/$UPDATE_BRANCH"

          title="ci: update pinned nightly to $CANDIDATE"
          body="The daily compatibility check passed with \`$CANDIDATE\`. Merged automatically once the checks passed."

          pr=$(gh pr list --state open --base master --head "$UPDATE_BRANCH" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base master --head "$UPDATE_BRANCH" \
              --title "$title" --body "$body"
            pr=$(gh pr list --state open --base master --head "$UPDATE_BRANCH" \
              --json number --jq '.[0].number')
          fi

          echo "verifying pull request #$pr"

          retries=15
          until [[ -n "$(gh pr checks "$pr" --json state --jq '.[].state' || true)" ]]; do
            if (( --retries <= 0 )); then
              echo "::error::no checks were started for pull request #$pr, so it is not verified and is left open for a maintainer."
              exit 1
            fi
            sleep 2
          done

          if gh pr checks "$pr" --watch --fail-fast; then
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "land=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the checks for pull request #$pr did not pass, so the update is not verified. It is left open for a maintainer, and the next run will retry."
            echo "The checks for pull request #$pr did not pass, so the update is not verified. It is left open for a maintainer." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Merge with a squash commit
        if: steps.publish.outputs.land == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR: ${{ steps.publish.outputs.pr }}
        run: gh pr merge "$PR" --squash --delete-branch

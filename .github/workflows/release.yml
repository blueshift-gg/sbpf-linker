name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.2 or v0.4.2)"
        required: true
        type: string
      mode:
        description: "Release mode"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - release

jobs:
  crates:
    name: Publish crates
    runs-on: ubuntu-latest
    concurrency:
      group: release-crates
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      release_mode: ${{ github.event_name == 'push' || inputs.mode == 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="${{ inputs.version }}"
          fi
          tag="v${raw#v}"          # accept 0.4.2 and v0.4.2
          v=$(yq -e '.package.version' Cargo.toml)
          test "$tag" = "v$v" \
            || { echo "::error::tag ${tag} does not match Cargo.toml version v$v"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""       # don't force -D warnings on the publish build

      - name: Install cargo-release
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-release@1.1.5

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates
        if: env.release_mode == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo release --unpublished --workspace --no-tag --no-push --execute --no-confirm --allow-branch '*,HEAD'

      - name: Publish crates (dry run)
        if: env.release_mode != 'true'
        run: cargo release --unpublished --workspace --no-tag --no-push --no-confirm --allow-branch '*,HEAD'

      - name: Create release
        if: env.release_mode == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; skipping creation"
          else
            gh release create "$tag" --generate-notes
          fi

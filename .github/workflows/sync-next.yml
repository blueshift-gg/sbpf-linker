name: Sync sbpf-linker-next

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: sync-sbpf-linker-next
  cancel-in-progress: false

permissions:
  contents: read

env:
  MASTER_BRANCH: master
  NEXT_BRANCH: sbpf-linker-next
  SYNC_BRANCH: automation/sync-master
  PIN_BRANCH: automation/track-sbpf
  SBPF_REPOSITORY: https://github.com/blueshift-gg/sbpf.git

jobs:
  sync_master:
    name: Merge master into sbpf-linker-next
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Create the app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MASTER_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Propose and verify the merge
        id: publish
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Bail if next branch doesn't exist
          if ! git ls-remote --exit-code --heads origin "$NEXT_BRANCH" >/dev/null; then
            echo "::error::$NEXT_BRANCH does not exist, so there is nothing to synchronize. If it was removed by accident, restore it."
            exit 1
          fi

          # Check if there's an open sync PR
          pr=$(gh pr list --state open --base "$NEXT_BRANCH" --head "$SYNC_BRANCH" \
            --json number --jq '.[0].number // empty')

          # Bail if next is already up-to-date with master
          if git merge-base --is-ancestor "origin/$MASTER_BRANCH" "origin/$NEXT_BRANCH"; then
            echo "::notice::$NEXT_BRANCH already contains every commit from $MASTER_BRANCH."
            exit 0
          fi

          # Branch off of the sync PR branch if it exists. Otherwise, starts fresh from the next branch
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$SYNC_BRANCH"
            git checkout -q -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git fetch --no-tags origin "$MASTER_BRANCH"
            git checkout -q -B "$SYNC_BRANCH" "origin/$NEXT_BRANCH"
          fi

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-ff -q --no-edit "origin/$MASTER_BRANCH" || {
            echo "::error::$MASTER_BRANCH does not merge cleanly into $NEXT_BRANCH. Resolve it on $SYNC_BRANCH, then dispatch this workflow from $SYNC_BRANCH to continue."
            exit 1
          }

          git push origin "HEAD:refs/heads/$SYNC_BRANCH"

          if [[ -z "$pr" ]]; then
            body=$(printf '%s\n' \
              "Merges \`$MASTER_BRANCH\` into \`$NEXT_BRANCH\`. CI runs on the merge commit of this pull request.")
            pr_url=$(gh pr create --base "$NEXT_BRANCH" --head "$SYNC_BRANCH" \
              --title "chore: merge $MASTER_BRANCH into $NEXT_BRANCH" \
              --body "$body" | tail -n 1)
            pr=${pr_url##*/}
          else
            echo "updating open sync pull request #$pr"
          fi

          echo "verifying pull request #$pr"

          # Wait for the pull request's checks to be created, then for them to finish.
          deadline=$((SECONDS + 600))
          until [[ -n "$(gh pr checks "$pr" --json state --jq '.[].state' || true)" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::no checks were started for pull request #$pr. If they are waiting on approval, approve them there and re-run this job, or merge it by hand. It is left open for a maintainer."
              exit 1
            fi
            sleep 20
          done

          head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)

          if gh pr checks "$pr" --watch --fail-fast; then
            {
              echo "pr=$pr"
              echo "head=$head"
              echo "land=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::the checks for pull request #$pr did not pass, so the merge is not verified. It is left open for a maintainer, and the next run will retry."
            echo "The checks for pull request #$pr did not pass, so the merge is not verified. It is left open for a maintainer." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Merge with a merge commit
        if: steps.publish.outputs.land == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR: ${{ steps.publish.outputs.pr }}
          HEAD: ${{ steps.publish.outputs.head }}
        run: gh pr merge "$PR" --merge --match-head-commit "$HEAD"

  track_sbpf:
    name: Track the sbpf pin
    needs: sync_master
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Create the app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEXT_BRANCH }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Track sbpf master
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          if ! tip=$(git ls-remote --exit-code "$SBPF_REPOSITORY" refs/heads/master | cut -f1); then
            echo "::error::could not resolve sbpf master"
            exit 1
          fi

          # Build on the pull request's branch when it is available, so a change made
          # there survives and the commit this run makes still descends from it.
          pin_sha=$(git ls-remote origin "refs/heads/$PIN_BRANCH" | cut -f1)
          if [[ -n "$pin_sha" ]]; then
            git fetch --no-tags origin "$pin_sha"
            git checkout -q -B "$PIN_BRANCH" FETCH_HEAD
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge -q --no-edit "origin/$NEXT_BRANCH" || {
              echo "::error::$PIN_BRANCH conflicts with $NEXT_BRANCH. Please resolve."
              exit 1
            }
          fi

          # Find the dependencies that track sbpf master in Cargo.toml and put them space-separated in `pkgs`
          read -ra pkgs <<< "$(yq -r '(.dependencies // {}) + (.workspace.dependencies // {}) | to_entries | map(select(.value.git == strenv(SBPF_REPOSITORY) and .value.branch == "master") | .key) | join(" ")' Cargo.toml)"
          [[ ${#pkgs[@]} -gt 0 ]] || { echo "::notice::no dependency tracks $SBPF_REPOSITORY master; nothing to track."; exit 0; }

          # The sbpf revs tracked in Cargo.lock
          pinned=$(NAMES="${pkgs[*]}" yq -p toml -o y -r '[.package[] | select(.name as $n | (strenv(NAMES) | split(" ")) | contains([$n])) | .source] | unique | join(", ")' Cargo.lock)
          from=${pinned##*#}

          echo "moving ${pkgs[*]} from ${pinned:-none} to $tip"
          cargo update "${pkgs[@]/#/-p}" --precise "$tip"
          git add Cargo.lock

          if git diff --cached --quiet; then
            echo "::notice::already tracking sbpf master at $tip."
            exit 0
          fi

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore: track sbpf master at ${tip:0:12}"
          echo "pinned=$from" >> "$GITHUB_OUTPUT"
          echo "rev=$tip" >> "$GITHUB_OUTPUT"

      - name: Push the bump and open the pull request
        if: steps.bump.outputs.rev != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PINNED: ${{ steps.bump.outputs.pinned }}
          REV: ${{ steps.bump.outputs.rev }}
        run: |
          set -euo pipefail

          git push origin "HEAD:refs/heads/$PIN_BRANCH"

          title="chore: track sbpf master at ${REV:0:12}"
          body=$(printf '%s\n' \
            "Moves the sbpf pin in \`Cargo.lock\` from \`${PINNED:0:12}\` to \`${REV:0:12}\`." \
            "" \
            "Upstream diff: https://github.com/blueshift-gg/sbpf/compare/${PINNED}...${REV}" \
            "" \
            "Merge this with a merge commit; DO NOT squash or rebase \`${NEXT_BRANCH}\`.")

          # Reuse the pull request an earlier run left open, rather than failing
          # because one already exists for this branch.
          pr=$(gh pr list --state open --base "$NEXT_BRANCH" --head "$PIN_BRANCH" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --base "$NEXT_BRANCH" --head "$PIN_BRANCH" \
              --title "$title" --body "$body"
          fi

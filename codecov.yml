codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
